<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315FEA">
<title>حضور وانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8FF;--card:#FFFFFF;--ink:#172B4D;
  --muted:#7183A3;--line:#E2EAF7;--accent:#3978F6;
  --in:#16A879;--out:#F07843;
  --shadow:0 10px 30px rgba(48,91,160,.09);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:Tajawal,system-ui,sans-serif;
  background:radial-gradient(ellipse at 92% 0%,rgba(57,120,246,.12),transparent 34%),linear-gradient(180deg,#F7FAFF 0%,var(--bg) 100%);
  color:var(--ink);min-height:100dvh;line-height:1.6;
  -webkit-font-smoothing:antialiased;letter-spacing:.05px;
}
.wrap{max-width:560px;margin:0 auto;padding:22px 17px calc(105px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
h1{font-size:32px;font-weight:800;letter-spacing:-.7px}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sub,.hello{color:var(--muted);font-size:14px;line-height:1.8}
.name{font-size:25px;font-weight:800;letter-spacing:-.4px}
.field{margin-top:14px}
label{display:block;font-weight:700;margin-bottom:7px;font-size:14px;color:var(--muted)}
input,select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:15px 16px;min-height:54px;outline:0;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent);
}
.btn{
  width:100%;font:inherit;font-size:17px;font-weight:800;
  border:0;border-radius:15px;padding:15px;min-height:54px;
  cursor:pointer;color:#fff;margin-top:14px;background:var(--accent);
  box-shadow:0 5px 13px color-mix(in srgb,var(--accent) 17%,transparent);
  transition:transform .18s ease,filter .18s ease;
}
.btn:active{transform:scale(.975);filter:brightness(.96)}
.btn:disabled{opacity:.45}
.in{background:var(--in)}
.outb{background:var(--out)}
.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.link,.back,.sm{background:0;border:0;color:var(--accent);font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:8px}
.sm.red{color:var(--out)}
.error{color:var(--out);font-size:14px;margin-top:8px;min-height:20px}
.msg{color:var(--in);font-size:14px;margin-top:8px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 2px}
.card{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:25px;padding:21px;border-color:#E5EDFA;box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px}
.stat{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:21px;
  padding:15px 5px;min-height:100px;text-align:center;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .18s,border-color .18s;
}
.stat:active{transform:scale(.97)}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--accent)}
.stat span{display:block;margin-top:3px;font-size:13px;color:var(--muted);font-weight:700}
.stat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.row,.entry{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  width:100%;text-align:right;font:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:13px 15px;margin-top:10px;
  min-height:66px;box-shadow:0 3px 12px rgba(30,45,90,.035);
}
button.row{cursor:pointer}
.sname{font-weight:800;font-size:16px;line-height:1.7}
.scode{font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:800;padding:6px 12px;border-radius:12px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.g{background:color-mix(in srgb,var(--in) 15%,transparent);color:var(--in)}
.pill.o{background:color-mix(in srgb,var(--out) 15%,transparent);color:var(--out)}
.pill.b{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.kind{font-weight:800}
.kind.in{color:var(--in);background:0}
.kind.out{color:var(--out)}
.dur{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--out);font-weight:700}
.time{font-weight:700;direction:ltr}
.snap{width:48px;height:48px;border-radius:15px;object-fit:cover;background:var(--line);border:2px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;line-height:2}
.tabs{
  position:fixed;inset:auto 0 0 0;z-index:10;display:flex;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid #E4ECF8;
  box-shadow:0 -5px 25px rgba(25,40,90,.06);
  padding:9px 7px calc(9px + env(safe-area-inset-bottom));
}
.tabs button{
  flex:1;background:0;border:0;font:inherit;font-size:12px;
  font-weight:800;color:var(--muted);padding:6px 0;cursor:pointer;
  border-radius:16px;min-height:55px;transition:background .2s,color .2s;
}
.tabs button i{display:block;font-style:normal;font-size:23px;margin-bottom:2px}
.tabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.big{
  display:block;margin:42px auto 18px;width:205px;height:205px;
  border-radius:50%;border:8px solid color-mix(in srgb,var(--card) 75%,transparent);
  outline:1px solid color-mix(in srgb,var(--in) 25%,transparent);
  font:inherit;font-size:29px;font-weight:800;color:#fff;background:var(--in);
  box-shadow:0 12px 30px color-mix(in srgb,var(--in) 24%,transparent),
  0 0 0 10px color-mix(in srgb,var(--in) 9%,transparent);
  cursor:pointer;transition:transform .2s ease,background .2s ease;
}
.big:active{transform:scale(.96)}
.big.out{
  background:var(--out);
  outline-color:color-mix(in srgb,var(--out) 25%,transparent);
  box-shadow:0 12px 30px color-mix(in srgb,var(--out) 24%,transparent),
  0 0 0 10px color-mix(in srgb,var(--out) 9%,transparent);
}
.big:disabled{opacity:.5}
.status{text-align:center;font-size:18px;font-weight:800;margin-top:14px;line-height:1.9}
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;animation:screenIn .22s ease}
.srow{display:flex;gap:8px;margin-top:10px}
.srow select{flex:1.4}
.srow input{flex:1}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:480px){.wrap{padding-left:22px;padding-right:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
<section id="loading"><p class="sub" style="text-align:center;margin-top:40vh">جاري التحميل…</p></section>
<section id="login" class="hidden">

  <div id="sform">
    <div class="field"><label>الاسم</label><input id="fname" autocomplete="name" placeholder="اكتب اسمك كما كتبه المدرس"></div>
    <div class="field"><label>رقم الطالب</label><input id="code" inputmode="numeric" autocomplete="off"></div>
    <p class="error" id="serr"></p><button class="btn" id="login-s">دخول</button>
  </div>
  <div id="tform" class="hidden">
    <div class="field"><label>الإيميل</label><input id="temail" inputmode="email" autocomplete="username"></div>
    <div class="field"><label>كلمة السر</label><input id="tpass" type="password" autocomplete="current-password"></div>
    <p class="error" id="terr"></p><button class="btn" id="login-t">دخول المدرس</button>
    <div style="text-align:center"><button class="link" id="to-s">رجوع لدخول الطالب</button></div>
  </div>
</section>
<section id="student" class="hidden">
  <div class="panel" id="p-home">
    <div class="top"><div><div class="hello" id="s-date"></div><div class="name" id="s-name"></div><div class="hello" id="s-group"></div></div><button class="sm" id="s-logout">خروج</button></div>
    <button class="big" id="big">حضور</button><div class="status" id="s-status"></div><p class="msg" id="s-msg" style="text-align:center"></p>
  </div>
  <div class="panel hidden" id="p-log"><h2>السجل</h2><div id="s-log"></div></div>
</section>
<section id="teacher" class="hidden">
  <div class="panel" id="p-today">
    <div class="top"><div><div class="hello">لوحة المدرس</div><div class="name" id="t-date"></div></div><button class="sm" id="t-logout">خروج</button></div>
    <div class="stats" id="counters"></div><div id="clist"></div>
  </div>
  <div class="panel hidden" id="p-abs">
    <h2>تقرير الغياب والتأخير</h2><div class="field"><label>المجموعة</label><select id="r-group"></select></div>
    <div class="field"><label>من</label><input id="r-from" type="date"></div><div class="field"><label>إلى</label><input id="r-to" type="date"></div><div id="rlist"></div>
  </div>
  <div class="panel hidden" id="p-stu">
    <h2>الطلاب</h2><div class="field"><select id="f-group"></select></div><div class="field"><input id="search" placeholder="🔍 ابحث بالاسم أو الرقم"></div><div id="students"></div>
  </div>
  <div class="panel hidden" id="p-set">
    <h2>الإعدادات</h2>
    <div class="card"><b>مواعيد الحصص</b><p class="sub">اختار اليوم والساعة لكل مجموعة.</p><div id="sched"></div><button class="btn" id="sched-save">حفظ المواعيد</button><p class="msg" id="sched-msg"></p></div>
    <div class="card"><b>مكان المدرسة</b><div class="field"><label>المسافة المسموحة (متر)</label><input id="radius" inputmode="numeric" value="30"></div><button class="btn alt" id="set-school">تحديد مكان المدرسة من موبايلي</button><p class="msg" id="school-msg"></p></div>
    <div class="card"><b>إضافة طالب</b><div class="field"><select id="a-group"></select></div><div class="field"><input id="a-code" inputmode="numeric" placeholder="رقم الطالب"></div><div class="field"><input id="a-name" placeholder="اسم الطالب الكامل"></div><div class="field"><input id="a-guard" inputmode="tel" placeholder="رقم ولي الأمر"></div><button class="btn in" id="add-btn">إضافة الطالب</button><p class="error" id="a-err"></p></div>
    <div class="card"><b>تصدير الحضور CSV</b><div class="field"><label>من</label><input id="e-from" type="date"></div><div class="field"><label>إلى</label><input id="e-to" type="date"></div><button class="btn alt" id="export">تصدير</button></div>
  </div>
</section>
</div>
<div class="ov hidden" id="ov"><div class="wrap">
  <button class="back" id="ov-back">← رجوع</button><div class="hello" id="d-code"></div><div class="name" id="d-name"></div>
  <div class="card">
    <div class="field" style="margin-top:0"><label>الاسم</label><input id="d-name-in"></div><button class="btn alt" id="d-name-save">حفظ الاسم</button>
    <div class="field"><label>المجموعة</label><select id="d-group"></select></div><button class="btn alt" id="d-group-save">حفظ المجموعة</button>
    <div class="field"><label>رقم ولي الأمر</label><input id="d-guard" inputmode="tel"></div><button class="btn alt" id="d-guard-save">حفظ الرقم</button>
    <button class="btn alt" id="d-wa">💬 واتساب لولي الأمر</button><p class="msg" id="d-msg"></p>
  </div>
  <div class="card"><div class="hello">الشهر الأول</div><div class="name" id="d-paid"></div><button class="btn alt" id="d-paid-btn">تغيير حالة الدفع</button></div>
  <div class="card"><b>تسجيل يدوي</b><button class="btn in" id="m-in">تسجيل حضور الآن</button><button class="btn outb" id="m-out">تسجيل انصراف الآن</button></div>
  <button class="btn alt" id="d-unbind">فك ربط الحساب (لو غيّر موبايله)</button>
  <div style="margin-top:22px"><h2>السجل</h2><div id="d-log"></div></div><button class="btn outb" id="d-del">حذف الطالب</button>
</div></div>
<nav class="tabs hidden" id="stabs"><button class="on" data-p="p-home"><i>🏠</i>الرئيسية</button><button data-p="p-log"><i>🕘</i>السجل</button></nav>
<nav class="tabs hidden" id="ttabs"><button class="on" data-p="p-today"><i>📅</i>اليوم</button><button data-p="p-abs"><i>🚫</i>الغياب</button><button data-p="p-stu"><i>👥</i>الطلاب</button><button data-p="p-set"><i>⚙️</i>الإعدادات</button></nav>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAXfBTspoxshk1PHViFon4gfORbFP3S7mA",authDomain:"attendance-school-2a84d.firebaseapp.com",projectId:"attendance-school-2a84d",storageBucket:"attendance-school-2a84d.firebasestorage.app",messagingSenderId:"347934096437",appId:"1:347934096437:web:f4b34dc18b814b4b64857c"});
const auth=getAuth(app),db=getFirestore(app);
const TEACHER="tttb58393@gmail.com",GROUPS=["أولى ثانوي","تانية ثانوي","تالتة ثانوي"],SK="attendance-student-code";
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],DAY_ORDER=[6,0,1,2,3,4,5];
const LATE_MS=10*60000,EARLY_MS=30*60000,WINDOW_DAYS=45,DAY_MS=864e5;
let sched={};
const $=id=>document.getElementById(id),norm=s=>String(s||"").replace(/\s+/g," ").trim();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AR_DATE=new Intl.DateTimeFormat("ar-EG",{weekday:"long",day:"numeric",month:"long"});
const AR_TIME=new Intl.DateTimeFormat("ar-EG",{hour:"2-digit",minute:"2-digit",hour12:true});
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const p2=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const toRec=d=>{const x=d.data({serverTimestamps:"estimate"});return{...x,id:d.id,ts:x.ts.toMillis()}};
const legacy=s=>(s.records||[]).map(r=>({...r,code:s.id,legacy:true}));
function distM(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))}
function getLoc(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)}),()=>r(null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
async function getPhoto(){let st=null;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});const v=document.createElement("video");v.playsInline=true;v.muted=true;v.srcObject=st;await v.play();await new Promise(r=>setTimeout(r,400));const z=Math.min(v.videoWidth,v.videoHeight);if(!z)return null;const c=document.createElement("canvas");c.width=c.height=240;c.getContext("2d").drawImage(v,(v.videoWidth-z)/2,(v.videoHeight-z)/2,z,z,0,0,240,240);return c.toDataURL("image/jpeg",.6)}catch{return null}finally{st&&st.getTracks().forEach(t=>t.stop())}}
function show(id){["loading","login","student","teacher"].forEach(s=>$(s).classList.toggle("hidden",s!==id));$("stabs").classList.toggle("hidden",id!=="student");$("ttabs").classList.toggle("hidden",id!=="teacher")}
function fillGroups(sel,cur,all){sel.innerHTML=(all?'<option value="">كل المجموعات</option>':"")+GROUPS.map(g=>`<option>${g}</option>`).join("");sel.value=cur||(all?"":GROUPS[0])}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{const nav=b.parentElement;nav.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));const sec=nav.id==="stabs"?$("student"):$("teacher");sec.querySelectorAll(".panel").forEach(p=>p.classList.toggle("hidden",p.id!==b.dataset.p));if(b.dataset.p==="p-abs")renderReport()}));
const photoFresh=r=>r.photoId&&Date.now()-Number(r.photoId)<DAY_MS;
function logHTML(recs,T){return recs.sort((a,b)=>b.ts-a.ts).slice(0,60).map(r=>`<div class="entry">${photoFresh(r)?`<img class="snap" data-c="${esc(r.code)}" data-p="${esc(r.photoId)}" alt="">`:""}<div style="flex:1"><div class="kind ${r.type}">${r.type==="in"?"حضور":"انصراف"}${r.method==="manual"?" (يدوي)":""}${r.method==="bio"?" (بصمة)":""}</div>${r.out?`<div class="warn">خارج المدرسة${r.dist!=null?" ("+r.dist+" م)":""}</div>`:""}<div class="dur">${AR_DATE.format(r.ts)}</div></div><div class="time">${AR_TIME.format(r.ts)}</div>${T?`<button class="sm red" data-del="${r.legacy?"L"+r.ts:r.id}">حذف</button>`:""}</div>`).join("")||'<div class="empty">لا توجد تسجيلات بعد</div>'}
function loadThumbs(box){box.querySelectorAll("img[data-p]").forEach(i=>getDoc(doc(db,"students",i.dataset.c,"photos",i.dataset.p)).then(s=>{if(s.exists())i.src=s.data().img;else i.remove()}).catch(()=>{}))}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function bioSupported(){try{return !!window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch{return false}}
async function bioVerify(){const ch=crypto.getRandomValues(new Uint8Array(32));if(!me.credId){const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:"حضور وانصراف"},user:{id:new TextEncoder().encode(me.code),name:me.code,displayName:me.name},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});me.credId=b64(c.rawId);await updateDoc(doc(db,"students",me.code),{credId:me.credId})}else{await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:"public-key",id:unb64(me.credId)}],userVerification:"required",timeout:60000}})}}
let me=null,myAtt=[],unsubMine=null,unsubSched=null;
const lastToday=recs=>{const k=dk(Date.now());const t=recs.filter(r=>dk(r.ts)===k).sort((a,b)=>a.ts-b.ts);return t[t.length-1]||null};
const lastAny=recs=>recs.reduce((a,r)=>!a||r.ts>a.ts?r:a,null);
function unlockAt(group,ts){let best=null;for(let i=0;i<=8;i++){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()+i);(sched[group]||[]).filter(x=>x.d===d.getDay()).forEach(x=>{const t=new Date(d);t.setHours(x.h,x.m,0,0);const v=t.getTime();if(v>ts&&(best===null||v<best))best=v})}if(best===null){const d=new Date(ts);d.setHours(24,0,0,0);return d.getTime()}return best-EARLY_MS}
const isLocked=l=>!!l&&l.type==="out"&&Date.now()<unlockAt(me.group,l.ts);

function renderToday(){$("t-date").textContent=AR_DATE.format(Date.now());const k=dk(Date.now()),rep=report(midnight(),midnight(),""),old=report(midnight(-WINDOW_DAYS),midnight(-1),"").filter(x=>x.t==="forgot");const lists={present:[],late:rep.filter(x=>x.t==="late").map(x=>x.s.name),absent:rep.filter(x=>x.t==="absent").map(x=>x.s.name),forgot:old.map(x=>x.s.name+" — "+AR_DATE.format(x.d)),outside:[]};students.forEach(s=>{const day=recsOf(s).filter(r=>dk(r.ts)===k);if(day.some(r=>r.type==="in"))lists.present.push(s.name);if(day.some(r=>r.out))lists.outside.push(s.name)});const defs=[["present","حاضر"],["late","متأخر"],["absent","غايب"],["forgot","نسي ينصرف"],["outside","من خارج المدرسة"]];$("counters").innerHTML=defs.map(([key,l])=>`<button class="stat${selKey===key?" on":""}" data-k="${key}"><b>${lists[key].length}</b><span>${l}</span></button>`).join("");$("clist").innerHTML=selKey?(lists[selKey].map(n=>`<div class="row"><span class="sname">${esc(n)}</span></div>`).join("")||'<div class="empty">لا أحد</div>'):'<div class="empty">اضغط على أي عدّاد لتشوف الأسماء</div>';$("counters").onclick=e=>{const b=e.target.closest("[data-k]");if(b){selKey=selKey===b.dataset.k?"":b.dataset.k;renderToday()}}}

function renderReport(){const g=$("r-group").value,from=new Date($("r-from").value+"T00:00:00"),to=new Date($("r-to").value+"T00:00:00");if(isNaN(from)||isNaN(to)){$("rlist").innerHTML="";return}const L={absent:["غايب","o","تغيّب عن"],late:["متأخر","b","تأخّر عن"],forgot:["نسي ينصرف","o","نسي تسجيل الانصراف في"]};const rows=report(from,to,g).sort((a,b)=>b.d-a.d||a.s.name.localeCompare(b.s.name,"ar"));$("rlist").innerHTML=rows.map(x=>{const[l,c,v]=L[x.t],txt="السلام عليكم، الطالب "+x.s.name+" "+v+" حصة الفيزياء يوم "+AR_DATE.format(x.d)+".",href=waLink((priv[x.s.id]||{}).guardian,txt);return`<div class="row"><div><div class="sname">${esc(x.s.name)}</div><div class="scode">${AR_DATE.format(x.d)}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="pill ${c}">${l}</span>${href?`<a href="${href}" target="_blank" rel="noopener" style="font-size:22px;text-decoration:none">💬</a>`:""}</div></div>`}).join("")||'<div class="empty">لا يوجد غياب أو تأخير في الفترة دي 👌</div>'}

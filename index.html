<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>حضور وانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5FA; --card: #FFFFFF; --ink: #14162B; --muted: #6B7085; --line: #E5E7F0;
    --accent: #2563EB; --in: #16A34A; --out: #EA580C;
    --radius: 20px; --shadow: 0 1px 2px rgba(20,22,43,.04), 0 8px 24px rgba(20,22,43,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1020; --card: #171A2E; --ink: #EEF0FA; --muted: #9097B0; --line: #262A44;
      --accent: #60A5FA; --in: #4ADE80; --out: #FB923C; --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Tajawal", system-ui, sans-serif; background: var(--bg); color: var(--ink);
    min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(color-mix(in srgb, var(--ink) 4%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--ink) 4%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .hidden { display: none !important; }
  .hero { display: flex; justify-content: center; margin: 8px 0 6px; }
  .hero svg { overflow: visible; }
  @media (prefers-reduced-motion: no-preference) { .hero svg { animation: orbit 16s linear infinite; } }
  @keyframes orbit { to { transform: rotate(360deg); } }

  .field { margin-top: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  input, select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }

  .btn {
    width: 100%; font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 16px;
    padding: 16px; cursor: pointer; color: #fff; margin-top: 16px; background: var(--accent);
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 28%, transparent); transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-in { background: var(--in); box-shadow: 0 8px 20px color-mix(in srgb, var(--in) 28%, transparent); }
  .btn-out { background: var(--out); box-shadow: 0 8px 20px color-mix(in srgb, var(--out) 28%, transparent); }
  .btn-alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 18px; padding: 8px; }
  .back { background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; }
  .error { color: var(--out); font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: 500; }
  .msg { color: var(--in); font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: 500; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .hello { font-size: 14px; color: var(--muted); }
  .name { font-size: 24px; font-weight: 800; }
  .small-btn { background: transparent; color: var(--accent); border: 0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 12px; }

  .card { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card-label { font-size: 14px; color: var(--muted); font-weight: 600; }
  .card-value { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 10px; vertical-align: middle; background: var(--muted); }
  .dot.in { background: var(--in); box-shadow: 0 0 0 4px color-mix(in srgb, var(--in) 20%, transparent); }
  .dot.out { background: var(--out); box-shadow: 0 0 0 4px color-mix(in srgb, var(--out) 20%, transparent); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 28px; font-weight: 800; }
  .stat span { font-size: 13px; color: var(--muted); font-weight: 600; }

  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 28px; }
  .list-head span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .day { margin-top: 14px; }
  .day-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: var(--shadow); flex-wrap: wrap; }
  .entry .kind { font-weight: 700; font-size: 15px; }
  .entry .kind.in { color: var(--in); }
  .entry .kind.out { color: var(--out); }
  .entry .time { font-size: 16px; font-weight: 600; direction: ltr; }
  .entry .dur { font-size: 13px; color: var(--muted); }
  .entry .warn { font-size: 13px; color: var(--out); font-weight: 600; }
  .entry a { font-size: 13px; color: var(--accent); }
  .snap { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; background: var(--line); flex-shrink: 0; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 15px; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: right; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
  .row .sname { font-weight: 700; font-size: 17px; }
  .row .scode { font-size: 13px; color: var(--muted); direction: ltr; text-align: right; }
  .pill { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
  .pill.in { background: color-mix(in srgb, var(--in) 14%, transparent); color: var(--in); }
  .pill.out { background: color-mix(in srgb, var(--out) 14%, transparent); color: var(--out); }
  .pill.none { background: var(--line); color: var(--muted); }
  .section { margin-top: 18px; }
  .paid-state { font-size: 20px; font-weight: 800; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <section id="loading">
    <div class="hero" aria-hidden="true"><svg viewBox="0 0 120 120" width="76" height="76">
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2" transform="rotate(60 60 60)"/>
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2" transform="rotate(-60 60 60)"/>
      <circle cx="60" cy="60" r="7" fill="var(--in)"/>
      <circle cx="110" cy="60" r="4" fill="var(--out)"/></svg></div>
    <p class="sub" style="text-align:center">جاري التحميل…</p>
  </section>

  <section id="login" class="hidden">
    <div class="hero" aria-hidden="true"><svg viewBox="0 0 120 120" width="76" height="76">
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2" transform="rotate(60 60 60)"/>
      <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="var(--accent)" stroke-width="2" transform="rotate(-60 60 60)"/>
      <circle cx="60" cy="60" r="7" fill="var(--in)"/>
      <circle cx="110" cy="60" r="4" fill="var(--out)"/></svg></div>
    <h1 style="text-align:center">حضور وانصراف</h1>
    <p class="sub" style="text-align:center">حصة الفيزياء · سجّل حضورك وانصرافك بضغطة واحدة.</p>

    <div id="student-form">
      <div class="field"><label for="code">رقم الطالب</label>
        <input id="code" inputmode="numeric" autocomplete="off" placeholder="مثال: 20231045"></div>
      <div class="field"><label for="fname">الاسم</label>
        <input id="fname" autocomplete="name" placeholder="اكتب اسمك كما كتبه المدرس"></div>
      <p class="error" id="student-error"></p>
      <button class="btn" id="login-student">دخول</button>
      <div style="text-align:center"><button class="link" id="show-teacher">دخول المدرس</button></div>
    </div>

    <div id="teacher-form" class="hidden">
      <div class="field"><label for="temail">الإيميل</label>
        <input id="temail" autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="tpass">كلمة السر</label>
        <input id="tpass" type="password" autocomplete="current-password"></div>
      <p class="error" id="teacher-error"></p>
      <button class="btn" id="login-teacher">دخول المدرس</button>
      <div style="text-align:center"><button class="link" id="show-student">رجوع لدخول الطالب</button></div>
    </div>
  </section>

  <section id="home" class="hidden">
    <div class="top">
      <div>
        <div class="hello" id="s-date"></div>
        <div class="name" id="s-name"></div>
        <div class="hello" id="s-group" style="margin-top:4px"></div>
      </div>
      <button class="small-btn" id="s-logout">خروج</button>
    </div>

    <div class="card">
      <div class="card-label">حالتك الآن</div>
      <div class="card-value"><span class="dot" id="s-dot"></span><span id="s-status"></span></div>
    </div>

    <button class="btn btn-in" id="in-btn">تسجيل حضور</button>
    <button class="btn btn-out hidden" id="out-btn">تسجيل انصراف</button>
    <p class="error" id="s-msg"></p>

    <div class="list-head"><h2>السجل</h2><span id="s-count"></span></div>
    <div id="s-log"></div>
  </section>

  <section id="teacher" class="hidden">
    <div class="top">
      <div>
        <div class="hello">لوحة المدرس</div>
        <div class="name" id="t-date"></div>
      </div>
      <button class="small-btn" id="t-logout">خروج</button>
    </div>

    <div class="card section">
      <div class="card-label">مكان المدرسة</div>
      <div class="field" style="margin-top:12px"><label for="school-radius">المسافة المسموحة (بالمتر)</label>
        <input id="school-radius" inputmode="numeric" value="30"></div>
      <button class="btn btn-alt" id="set-school" style="color:var(--ink)">تحديد مكان المدرسة من موبايلي</button>
      <p class="msg" id="school-msg"></p>
    </div>

    <div class="card section">
      <div class="card-label">إضافة طالب للمجموعة المختارة</div>
      <div class="field" style="margin-top:12px"><input id="add-code" inputmode="numeric" autocomplete="off" placeholder="رقم الطالب"></div>
      <div class="field" style="margin-top:10px"><input id="add-name" autocomplete="off" placeholder="اسم الطالب الكامل"></div>
      <div class="field" style="margin-top:10px"><input id="add-guardian" inputmode="tel" autocomplete="off" placeholder="رقم ولي الأمر"></div>
      <button class="btn btn-in" id="add-btn">إضافة الطالب</button>
      <p class="error" id="add-error"></p>
    </div>

    <div class="card section">
      <div class="card-label">تصدير الحضور CSV</div>
      <div class="field" style="margin-top:12px"><label for="exp-from">من تاريخ</label><input id="exp-from" type="date"></div>
      <div class="field" style="margin-top:10px"><label for="exp-to">إلى تاريخ</label><input id="exp-to" type="date"></div>
      <button class="btn btn-alt" id="export-btn" style="color:var(--ink)">تصدير</button>
    </div>

    <div id="groups-list" style="margin-top:24px"></div>

    <div id="group-view" class="hidden">
      <button class="back" id="group-back">← رجوع للمجموعات</button>
      <div class="name" id="group-title" style="margin-top:6px"></div>
      <div class="stats">
        <div class="stat"><b id="n-in">0</b><span>حاضر</span></div>
        <div class="stat"><b id="n-out">0</b><span>انصرف</span></div>
        <div class="stat"><b id="n-none">0</b><span>لم يسجّل</span></div>
      </div>
      <div class="list-head"><h2>الطلاب</h2><span id="n-total"></span></div>
      <div id="students" style="margin-top:12px"></div>

      <div id="detail" class="hidden" style="margin-top:12px">
        <button class="back" id="back-btn">← رجوع للقائمة</button>
        <div class="hello" id="d-code" style="margin-top:8px"></div>
        <div class="name" id="d-name"></div>

        <div class="card">
          <div class="field" style="margin-top:0"><label for="d-name-in">اسم الطالب</label><input id="d-name-in"></div>
          <button class="btn btn-alt" id="name-save" style="color:var(--ink)">حفظ الاسم</button>
          <div class="field" style="margin-top:16px"><label for="d-group">المجموعة</label><select id="d-group"></select></div>
          <button class="btn btn-alt" id="group-save" style="color:var(--ink)">حفظ المجموعة</button>
          <p class="msg" id="d-msg"></p>
        </div>

        <div class="card">
          <div class="card-label">رقم ولي الأمر</div>
          <div class="field" style="margin-top:8px"><input id="d-guardian-in" inputmode="tel" autocomplete="off"></div>
          <button class="btn btn-in" id="guardian-save">حفظ رقم ولي الأمر</button>
          <div class="card-label" style="margin-top:18px">الشهر الأول</div>
          <div class="paid-state" id="d-paid">—</div>
          <button class="btn btn-alt" id="paid-btn" style="color:var(--ink)">تغيير حالة الدفع</button>
        </div>

        <button class="btn btn-alt" id="unbind-btn" style="color:var(--ink)">فك ربط الحساب (لو غيّر موبايله)</button>
        <p class="error" id="unbind-msg"></p>

        <div class="list-head"><h2>السجل</h2></div>
        <div id="d-log" style="margin-top:8px"></div>
        <button class="btn btn-out" id="del-student">حذف الطالب</button>
      </div>
    </div>
  </section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXfBTspoxshk1PHViFon4gfORbFP3S7mA",
    authDomain: "attendance-school-2a84d.firebaseapp.com",
    projectId: "attendance-school-2a84d",
    storageBucket: "attendance-school-2a84d.firebasestorage.app",
    messagingSenderId: "347934096437",
    appId: "1:347934096437:web:f4b34dc18b814b4b64857c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const TEACHER_EMAIL = "tttb58393@gmail.com";
  const GROUPS = ["أولى ثانوي", "تانية ثانوي", "تالتة ثانوي"];
  const NONE = "__none__";
  const SESSION_KEY = "attendance-student-code";

  const $ = (id) => document.getElementById(id);
  const norm = (s) => String(s || "").replace(/\s+/g, " ").trim();
  const AR_DATE = new Intl.DateTimeFormat("ar-EG", { weekday: "long", day: "numeric", month: "long" });
  const AR_TIME = new Intl.DateTimeFormat("ar-EG", { hour: "2-digit", minute: "2-digit", hour12: true });
  const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  const fmtDur = (ms) => {
    const m = Math.round(ms / 60000), h = Math.floor(m / 60), mm = m % 60;
    if (h === 0) return mm + " دقيقة";
    return h + " ساعة" + (mm ? " و" + mm + " دقيقة" : "");
  };
  function distM(a, b) {
    const R = 6371000, t = Math.PI / 180;
    const dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(x)));
  }
  function show(id) {
    ["loading", "login", "home", "teacher"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
  }
  function fillGroups(sel, current, withAll) {
    sel.innerHTML = "";
    sel.appendChild(new Option(withAll ? "كل المجموعات" : "اختار المجموعة", ""));
    GROUPS.forEach((g) => sel.appendChild(new Option(g, g)));
    sel.value = current || "";
  }
  function getLoc() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }
  async function getPhoto() {
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      const video = document.createElement("video");
      video.playsInline = true; video.muted = true; video.srcObject = stream;
      await video.play();
      await new Promise((r) => setTimeout(r, 400));
      const size = Math.min(video.videoWidth, video.videoHeight);
      if (!size) return null;
      const c = document.createElement("canvas");
      c.width = 240; c.height = 240;
      c.getContext("2d").drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, 240, 240);
      return c.toDataURL("image/jpeg", 0.6);
    } catch { return null; }
    finally { if (stream) stream.getTracks().forEach((t) => t.stop()); }
  }

  function renderLog(container, records, countEl, opts = {}) {
    const { teacher = false, code = "", onDel = null } = opts;
    container.innerHTML = "";
    const recs = [...records].sort((a, b) => b.ts - a.ts);
    if (countEl) countEl.textContent = recs.length ? recs.length + " تسجيل" : "";
    if (!recs.length) { container.innerHTML = '<div class="empty">لا توجد تسجيلات بعد</div>'; return; }

    const groups = {};
    recs.forEach((r) => (groups[dayKey(r.ts)] ||= []).push(r));
    Object.values(groups).forEach((list) => {
      const day = document.createElement("div");
      day.className = "day";
      const title = document.createElement("div");
      title.className = "day-title";
      title.textContent = AR_DATE.format(list[0].ts);
      day.appendChild(title);

      const asc = [...list].reverse();
      const dur = {};
      let open = null;
      asc.forEach((r) => {
        if (r.type === "in") open = r;
        else if (open) { dur[r.ts] = r.ts - open.ts; open = null; }
      });

      list.forEach((r) => {
        const e = document.createElement("div");
        e.className = "entry";

        if (teacher && r.photo) {
          const img = document.createElement("img");
          img.className = "snap"; img.alt = "";
          e.appendChild(img);
          getDoc(doc(db, "students", code, "photos", String(r.ts)))
            .then((s) => { if (s.exists()) img.src = s.data().img; })
            .catch(() => {});
        }

        const left = document.createElement("div");
        const kind = document.createElement("div");
        kind.className = "kind " + r.type;
        kind.textContent = r.type === "in" ? "حضور" : "انصراف";
        left.appendChild(kind);

        if (r.type === "out" && dur[r.ts] != null) {
          const d = document.createElement("div");
          d.className = "dur";
          d.textContent = "مدة الحضور: " + fmtDur(dur[r.ts]);
          left.appendChild(d);
        }
        if (r.out) {
          const w = document.createElement("div");
          w.className = "warn";
          w.textContent = "خارج المدرسة" + (r.dist != null ? " (" + r.dist + " متر)" : "");
          left.appendChild(w);
        }
        if (teacher && r.loc) {
          const a = document.createElement("a");
          a.href = "https://maps.google.com/?q=" + r.loc.lat + "," + r.loc.lng;
          a.target = "_blank"; a.rel = "noopener";
          a.textContent = "📍 الموقع (دقة " + r.loc.acc + " متر)";
          left.appendChild(a);
        }
        e.appendChild(left);

        const t = document.createElement("div");
        t.className = "time";
        t.textContent = AR_TIME.format(r.ts);
        e.appendChild(t);

        if (onDel) {
          const del = document.createElement("button");
          del.className = "small-btn";
          del.style.color = "var(--out)";
          del.textContent = "حذف";
          del.addEventListener("click", () => onDel(r.ts));
          e.appendChild(del);
        }
        day.appendChild(e);
      });
      container.appendChild(day);
    });
  }

  let me = null;
  let writeChain = Promise.resolve();

  function todayRecs(records) {
    const k = dayKey(Date.now());
    return records.filter((r) => dayKey(r.ts) === k).sort((a, b) => a.ts - b.ts);
  }
  function lastToday(records) {
    const t = todayRecs(records);
    return t[t.length - 1] || null;
  }

  function renderStudent() {
    $("s-date").textContent = AR_DATE.format(Date.now());
    $("s-name").textContent = me.name;
    $("s-group").textContent = "المجموعة: " + (me.group || "مش متحدد");
    const last = lastToday(me.records);
    const inside = !!last && last.type === "in";
    $("s-dot").className = "dot" + (inside ? " in" : last ? " out" : "");
    $("s-status").textContent = !last ? "لم تسجّل حضور اليوم"
      : inside ? "حاضر منذ " + AR_TIME.format(last.ts)
      : "انصرفت الساعة " + AR_TIME.format(last.ts);
    $("in-btn").classList.toggle("hidden", inside);
    $("out-btn").classList.toggle("hidden", !inside);
    renderLog($("s-log"), me.records, $("s-count"));
  }

  function saveMe() {
    writeChain = writeChain.then(async () => {
      try {
        await updateDoc(doc(db, "students", me.code), { records: me.records });
        return true;
      } catch {
        $("s-msg").textContent = "ما قدرناش نحفظ التسجيل. جرّب تاني.";
        return false;
      }
    });
    return writeChain;
  }

  async function record(type) {
    $("s-msg").textContent = "";
    const last = lastToday(me.records);
    if (type === "in" && last && last.type === "in") { $("s-msg").textContent = "أنت مسجّل حضور بالفعل."; return; }
    if (type === "out" && (!last || last.type !== "in")) { $("s-msg").textContent = "لازم تسجّل حضورك الأول."; return; }

    const ts = Date.now();
    $("in-btn").disabled = true; $("out-btn").disabled = true;
    $("s-msg").textContent = "بنحدد موقعك وبنصوّرك…";
    const [loc, photo] = await Promise.all([getLoc(), getPhoto()]);

    let school = null;
    try {
      const sn = await getDoc(doc(db, "settings", "school"));
      school = sn.exists() ? sn.data() : null;
    } catch { school = null; }
    const dist = loc && school && school.lat != null ? distM(loc, school) : null;
    const out = dist !== null && dist > (school.radius || 30);

    let photoSaved = false;
    if (photo) {
      try {
        await setDoc(doc(db, "students", me.code, "photos", String(ts)), { img: photo });
        photoSaved = true;
      } catch {
        photoSaved = false;
      }
    }

    me.records.push({ type, ts, loc, photo: photoSaved, out, dist });
    renderStudent();
    const ok = await saveMe();
    $("in-btn").disabled = false; $("out-btn").disabled = false;

    const parts = [];
    if (!loc) parts.push("الموقع");
    if (!photo) parts.push("الصورة");
    else if (!photoSaved) parts.push("حفظ الصورة");
    if (out) parts.push("أنت بعيد عن المدرسة (" + dist + " متر)، التسجيل اتحفظ كخارج المدرسة");
    if (ok) $("s-msg").textContent = parts.length ? "ما قدرناش نحدد " + parts.join(" ولا ") + "." : "";
  }

  $("in-btn").addEventListener("click", () => record("in"));
  $("out-btn").addEventListener("click", () => record("out"));
  $("s-logout").addEventListener("click", () => {
    localStorage.removeItem(SESSION_KEY);
    me = null;
    $("code").value = ""; $("fname").value = "";
    $("student-error").textContent = "";
    show("login");
    $("student-form").classList.remove("hidden");
    $("teacher-form").classList.add("hidden");
  });

  async function enterStudent(code, uid) {
    const ref = doc(db, "students", code);
    const snap = await getDoc(ref);
    if (!snap.exists()) return { error: "الرقم ده مش مسجّل عند المدرس. كلّم المدرس يضيفك." };
    const d = snap.data();
    if (d.lock && d.lock !== uid) return { error: "الرقم ده مربوط بحساب تاني. كلّم المدرس." };
    if (!d.lock) await updateDoc(ref, { lock: uid });
    me = { code, name: d.name, group: d.group || "", records: d.records || [] };
    localStorage.setItem(SESSION_KEY, code);
    show("home");
    renderStudent();
    return { ok: true };
  }

  $("login-student").addEventListener("click", async () => {
    const code = $("code").value.trim();
    const name = norm($("fname").value);
    $("student-error").textContent = "";
    if (!/^[A-Za-z0-9]+$/.test(code) || !name) { $("student-error").textContent = "اكتب رقم الطالب والاسم."; return; }
    try {
      if (!auth.currentUser) await signInAnonymously(auth);
      const uid = auth.currentUser.uid;
      const snap = await getDoc(doc(db, "students", code));
      if (snap.exists() && norm(snap.data().name) !== name) {
        $("student-error").textContent = "الاسم مش مطابق للي المدرس سجله. اكتبه زي ما هو.";
        return;
      }
      const res = await enterStudent(code, uid);
      if (res.error) $("student-error").textContent = res.error;
    } catch {
      $("student-error").textContent = "في مشكلة في الاتصال. جرّب تاني.";
    }
  });

  $("show-teacher").addEventListener("click", () => {
    $("student-form").classList.add("hidden");
    $("teacher-form").classList.remove("hidden");
    $("temail").value = TEACHER_EMAIL;
  });
  $("show-student").addEventListener("click", () => {
    $("teacher-form").classList.add("hidden");
    $("student-form").classList.remove("hidden");
  });
  $("login-teacher").addEventListener("click", async () => {
    $("teacher-error").textContent = "";
    try {
      await signInWithEmailAndPassword(auth, $("temail").value.trim(), $("tpass").value);
      $("tpass").value = "";
    } catch {
      $("teacher-error").textContent = "الإيميل أو كلمة السر غلط.";
    }
  });

  let students = [];
  let currentGroup = "";
  let detail = null;
  let privInfo = {};
  let unsubStudents = null;

  function studentStatus(s) {
    const last = lastToday(s.records || []);
    if (!last) return { cls: "none", text: "لم يسجّل" };
    return last.type === "in" ? { cls: "in", text: "حاضر" } : { cls: "out", text: "انصرف" };
  }
  function inGroup(s, g) {
    return g === NONE ? !GROUPS.includes(s.group) : s.group === g;
  }

  function renderGroups() {
    const box = $("groups-list");
    box.innerHTML = "";
    const keys = GROUPS.concat(students.some((s) => !GROUPS.includes(s.group)) ? [NONE] : []);
    keys.forEach((g) => {
      const count = students.filter((s) => inGroup(s, g)).length;
      const btn = document.createElement("button");
      btn.className = "row";
      const left = document.createElement("div");
      const n = document.createElement("div");
      n.className = "sname";
      n.textContent = g === NONE ? "بدون مجموعة" : g;
      const c = document.createElement("div");
      c.className = "scode";
      c.textContent = count + " طالب";
      left.appendChild(n); left.appendChild(c);
      btn.appendChild(left);
      btn.addEventListener("click", () => { currentGroup = g; showGroup(); });
      box.appendChild(btn);
    });
  }

  function showGroup() {
    $("groups-list").classList.add("hidden");
    $("group-view").classList.remove("hidden");
    $("group-title").textContent = currentGroup === NONE ? "بدون مجموعة" : currentGroup;
    $("detail").classList.add("hidden");
    $("students").classList.remove("hidden");
    renderTeacher();
  }

  $("group-back").addEventListener("click", () => {
    currentGroup = "";
    $("group-view").classList.add("hidden");
    $("groups-list").classList.remove("hidden");
    renderGroups();
  });

  function renderTeacher() {
    $("t-date").textContent = AR_DATE.format(Date.now());
    renderGroups();
    if (!currentGroup) return;

    const list = students.filter((s) => inGroup(s, currentGroup))
      .sort((a, b) => norm(a.name).localeCompare(norm(b.name), "ar"));
    let nIn = 0, nOut = 0, nNone = 0;
    const box = $("students");
    box.innerHTML = "";
    list.forEach((s) => {
      const st = studentStatus(s);
      if (st.cls === "in") nIn++; else if (st.cls === "out") nOut++; else nNone++;
      const btn = document.createElement("button");
      btn.className = "row";
      const left = document.createElement("div");
      const n = document.createElement("div");
      n.className = "sname"; n.textContent = s.name || "بدون اسم";
      const c = document.createElement("div");
      c.className = "scode"; c.textContent = s.code || s.id;
      left.appendChild(n); left.appendChild(c);
      const pill = document.createElement("span");
      pill.className = "pill " + st.cls;
      pill.textContent = st.text;
      btn.appendChild(left); btn.appendChild(pill);
      btn.addEventListener("click", () => openDetail(s.id));
      box.appendChild(btn);
    });
    if (!list.length) box.innerHTML = '<div class="empty">ما فيه طلاب في المجموعة دي</div>';
    $("n-in").textContent = nIn;
    $("n-out").textContent = nOut;
    $("n-none").textContent = nNone;
    $("n-total").textContent = list.length ? list.length + " طالب" : "";
  }

  function paintPaid(paid) {
    $("d-paid").textContent = paid ? "دفع" : "لم يدفع بعد";
  }

  async function openDetail(code) {
    const s = students.find((x) => x.id === code);
    if (!s) return;
    detail = s;
    $("students").classList.add("hidden");
    $("detail").classList.remove("hidden");
    $("d-code").textContent = s.code || s.id;
    $("d-name").textContent = s.name || "بدون اسم";
    $("d-name-in").value = s.name || "";
    fillGroups($("d-group"), s.group, false);
    $("d-msg").textContent = "";
    $("unbind-msg").textContent = "";

    try {
      const pr = await getDoc(doc(db, "private", s.id));
      privInfo = pr.exists() ? (pr.data() || {}) : {};
    } catch { privInfo = {}; }
    $("d-guardian-in").value = privInfo.guardian || "";
    paintPaid(!!privInfo.paid);
    renderLog($("d-log"), s.records || [], null, {
      teacher: true,
      code: s.id,
      onDel: deleteRecord
    });
  }

  $("back-btn").addEventListener("click", () => {
    detail = null;
    $("detail").classList.add("hidden");
    $("students").classList.remove("hidden");
  });

  async function deleteRecord(ts) {
    if (!detail) return;
    const left = (detail.records || []).filter((r) => r.ts !== ts);
    try {
      await updateDoc(doc(db, "students", detail.id), { records: left });
      detail.records = left;
      openDetail(detail.id);
    } catch {
      $("d-msg").textContent = "ما قدرناش نحذف التسجيل. جرّب تاني.";
    }
  }

  $("name-save").addEventListener("click", async () => {
    const v = norm($("d-name-in").value);
    if (!v || !detail) { $("d-msg").textContent = "اكتب الاسم."; return; }
    try {
      await updateDoc(doc(db, "students", detail.id), { name: v });
      $("d-name").textContent = v;
      $("d-msg").textContent = "تم حفظ الاسم.";
    } catch { $("d-msg").textContent = "ما قدرناش نحفظ الاسم."; }
  });

  $("group-save").addEventListener("click", async () => {
    if (!detail) return;
    try {
      await updateDoc(doc(db, "students", detail.id), { group: $("d-group").value });
      $("d-msg").textContent = "تم حفظ المجموعة.";
    } catch { $("d-msg").textContent = "ما قدرناش نحفظ المجموعة."; }
  });

  $("guardian-save").addEventListener("click", async () => {
    if (!detail) return;
    try {
      await setDoc(doc(db, "private", detail.id), { guardian: norm($("d-guardian-in").value) }, { merge: true });
      $("d-msg").textContent = "تم حفظ رقم ولي الأمر.";
    } catch { $("d-msg").textContent = "ما قدرناش نحفظ الرقم."; }
  });

  $("paid-btn").addEventListener("click", async () => {
    if (!detail) return;
    const next = !privInfo.paid;
    try {
      await setDoc(doc(db, "private", detail.id), { paid: next }, { merge: true });
      privInfo.paid = next;
      paintPaid(next);
    } catch { $("d-msg").textContent = "ما قدرناش نغيّر حالة الدفع."; }
  });

  $("unbind-btn").addEventListener("click", async () => {
    if (!detail) return;
    try {
      await updateDoc(doc(db, "students", detail.id), { lock: "" });
      $("unbind-msg").textContent = "تم فك الربط. الطالب يدخل من حسابه الجديد.";
    } catch { $("unbind-msg").textContent = "ما قدرناش نفك الربط."; }
  });

  $("del-student").addEventListener("click", async () => {
    if (!detail) return;
    try {
      await deleteDoc(doc(db, "students", detail.id));
      await deleteDoc(doc(db, "private", detail.id)).catch(() => {});
      detail = null;
      $("detail").classList.add("hidden");
      $("students").classList.remove("hidden");
    } catch { $("d-msg").textContent = "ما قدرناش نحذف الطالب."; }
  });

  $("add-btn").addEventListener("click", async () => {
    const code = $("add-code").value.trim();
    const name = norm($("add-name").value);
    $("add-error").textContent = "";
    if (currentGroup === NONE || !currentGroup) { $("add-error").textContent = "ادخل على مجموعة من الكروت الأول."; return; }
    if (!/^[A-Za-z0-9]+$/.test(code) || !name) { $("add-error").textContent = "اكتب رقم الطالب (أرقام بس) واسمه."; return; }
    try {
      const ref = doc(db, "students", code);
      if ((await getDoc(ref)).exists()) { $("add-error").textContent = "الرقم ده مضاف قبل كده."; return; }
      await setDoc(ref, { code, name, group: currentGroup, lock: "", records: [] });
      await setDoc(doc(db, "private", code), { guardian: norm($("add-guardian").value), paid: false });
      $("add-code").value = ""; $("add-name").value = ""; $("add-guardian").value = "";
      $("add-error").textContent = "تمت إضافة الطالب.";
    } catch { $("add-error").textContent = "ما قدرناش نضيف الطالب. جرّب تاني."; }
  });

  $("set-school").addEventListener("click", async () => {
    $("school-msg").textContent = "بنحدد مكانك…";
    const loc = await getLoc();
    if (!loc) { $("school-msg").textContent = "ما قدرناش نحدد مكانك. افتح الصفحة وإنت في المدرسة."; return; }
    const radius = Number($("school-radius").value) || 30;
    try {
      await setDoc(doc(db, "settings", "school"), { lat: loc.lat, lng: loc.lng, radius });
      $("school-msg").textContent = "تم حفظ مكان المدرسة (نطاق " + radius + " متر).";
    } catch { $("school-msg").textContent = "ما قدرناش نحفظ المكان."; }
  });

  $("export-btn").addEventListener("click", () => {
    const from = $("exp-from").value ? new Date($("exp-from").value).getTime() : -Infinity;
    const to = $("exp-to").value ? new Date($("exp-to").value).getTime() + 86400000 : Infinity;
    const rows = [["الكود", "الاسم", "المجموعة", "الوقت", "النوع", "خارج المدرسة", "الموقع"]];
    students.forEach((s) => (s.records || []).filter((r) => r.ts >= from && r.ts < to).forEach((r) => rows.push([
      s.code || s.id, s.name || "", s.group || "",
      new Date(r.ts).toLocaleString("ar-EG"),
      r.type === "in" ? "حضور" : "انصراف",
      r.out ? "نعم" : "",
      r.loc ? r.loc.lat + "," + r.loc.lng : ""
    ])));
    const csv = rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "attendance.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  $("t-logout").addEventListener("click", () => signOut(auth));

  function startTeacher() {
    show("teacher");
    fillGroups($("d-group"), "", false);
    currentGroup = "";
    $("group-view").classList.add("hidden");
    $("groups-list").classList.remove("hidden");
    if (!unsubStudents) {
      unsubStudents = onSnapshot(collection(db, "students"), (snap) => {
        students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderTeacher();
        if (detail) {
          const fresh = students.find((x) => x.id === detail.id);
          if (fresh) detail = fresh;
        }
      });
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (user && !user.isAnonymous && user.email === TEACHER_EMAIL) {
      startTeacher();
      return;
    }
    if (user && !user.isAnonymous) {
      await signOut(auth);
      show("login");
      return;
    }
    if (user && user.isAnonymous) {
      const code = localStorage.getItem(SESSION_KEY);
      if (code) {
        try {
          const res = await enterStudent(code, user.uid);
          if (res.ok) return;
        } catch {}
      }
    }
    show("login");
  });
</script>
</body>
</html>
